name: Auto Update & Release

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Update NuGet dependencies (including CefSharp)
      - name: Update Dependencies
        uses: yanovian/update-dependencies-action@v1
        with:
          update-strategy: non-breaking
          create-pull-request: false
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore AllScreenReader.sln

      - name: Build
        run: dotnet build AllScreenReader.sln --configuration Release

      - name: Publish
        run: dotnet publish AllScreenReader/AllScreenReader.csproj -c Release -o publish

      - name: Zip artifacts
        run: powershell Compress-Archive -Path publish\* -DestinationPath AllScreenReader.zip

      - name: Generate version tag
        id: version
        run: |
          echo "tag=v$(Get-Date -Format 'yyyy.MM.dd.HHmm')" >> $env:GITHUB_OUTPUT

      - name: Create Tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag ${{ steps.version.outputs.tag }}
          git push origin ${{ steps.version.outputs.tag }}

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          files: AllScreenReader.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
