name: Auto Update & Release

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Dependencies
        uses: yanovian/update-dependencies-action@v1
        with:
          update-strategy: non-breaking
          allowed-major-upgrades: CefSharp.Common.NETCore,CefSharp.WinForms.NETCore
          create-pull-request: false
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for dependency changes
        id: changes
        shell: pwsh
        run: |
          git diff --quiet
          if ($LASTEXITCODE -eq 0) {
            Add-Content -Path $env:GITHUB_OUTPUT -Value "changed=false"
          } else {
            Add-Content -Path $env:GITHUB_OUTPUT -Value "changed=true"
          }

      - name: Commit dependency updates
        if: steps.changes.outputs.changed == 'true'
        shell: pwsh
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "Update dependencies"
          git push

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        shell: pwsh
        run: dotnet restore AllScreenReader.sln

      - name: Build
        if: steps.changes.outputs.changed == 'true'
        shell: pwsh
        run: dotnet build AllScreenReader.sln --configuration Release

      - name: Publish
        if: steps.changes.outputs.changed == 'true'
        shell: pwsh
        run: dotnet publish AllScreenReader/AllScreenReader.csproj -c Release -o publish

      - name: Zip artifacts
        if: steps.changes.outputs.changed == 'true'
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath AllScreenReader.zip

      - name: Generate version tag
        id: version
        if: steps.changes.outputs.changed == 'true'
        shell: pwsh
        run: |
          $tag = "v" + (Get-Date -Format "yyyy.MM.dd.HHmm")
          Add-Content -Path $env:GITHUB_OUTPUT -Value "tag=$tag"

      - name: Create Tag
        if: steps.changes.outputs.changed == 'true'
        shell: pwsh
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag ${{ steps.version.outputs.tag }}
          git push origin ${{ steps.version.outputs.tag }}

      - name: Create Release
        if: steps.changes.outputs.changed == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          files: AllScreenReader.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
