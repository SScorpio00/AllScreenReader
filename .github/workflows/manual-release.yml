name: Auto Update & Release

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Dependencies
        uses: yanovian/update-dependencies-action@v1
        with:
          update-strategy: non-breaking
          create-pull-request: false
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for dependency changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $env:GITHUB_OUTPUT
          else
            echo "changed=true" >> $env:GITHUB_OUTPUT
          fi
      
      - name: Commit dependency updates
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "Update dependencies"
          git push

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore AllScreenReader.sln

      - name: Build
        if: steps.changes.outputs.changed == 'true'
        run: dotnet build AllScreenReader.sln --configuration Release

      - name: Publish
        if: steps.changes.outputs.changed == 'true'
        run: dotnet publish AllScreenReader/AllScreenReader.csproj -c Release -o publish

      - name: Zip artifacts
        if: steps.changes.outputs.changed == 'true'
        run: powershell Compress-Archive -Path publish\* -DestinationPath AllScreenReader.zip

      - name: Generate version tag
        id: version
        if: steps.changes.outputs.changed == 'true'
        run: |
          echo "tag=v$(Get-Date -Format 'yyyy.MM.dd.HHmm')" >> $env:GITHUB_OUTPUT

      - name: Create Tag
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag ${{ steps.version.outputs.tag }}
          git push origin ${{ steps.version.outputs.tag }}

      - name: Create Release
        if: steps.changes.outputs.changed == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          files: AllScreenReader.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
